# Database
spring.datasource.url=jdbc:mysql://localhost:3306/banking
spring.datasource.username=root
spring.datasource.password=Ngeleh1945
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# HikariCP
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=60000

# Hibernate / JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
jwt.secret=mySuperSecretKeyForBankAdminDashboardSystemToken123!
logging.level.org.springframework.security=DEBUG

# Konfigurasi Cookie Secure (false untuk development lokal HTTP, true untuk production HTTPS)
app.security.cookie.secure=false

#Config redis
spring.data.redis.host=127.0.0.1
spring.data.redis.port=6380